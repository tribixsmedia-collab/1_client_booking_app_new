<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Book trusted home services near you.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Home Service">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Home Service</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* No splash here on purpose: the browser already shows the page loading,
       and flutter_native_splash's web output added a second full-screen logo
       on top of that. `web: false` in pubspec.yaml stops it coming back if
       the splash assets are ever regenerated. */
    html { height: 100%; }
    body { margin: 0; min-height: 100%; background-color: #FFFFFF; }
  </style>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Razorpay Checkout. The razorpay_flutter plugin is Android/iOS only,
       so the web build drives this SDK instead (lib/services/checkout). -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
