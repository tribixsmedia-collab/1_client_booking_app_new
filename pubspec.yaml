name: customer_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  video_player: ^2.11.1
  visibility_detector: ^0.4.0+2
  # flutter_native_splash: ^2.4.4
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  razorpay_flutter: ^1.4.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21   

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/assistant_bot.png

  # Brand typefaces, matched to the RNI Realestate web identity:
  # Manrope for every UI/body string, Playfair Display for display headings.
  # Bundled rather than fetched at runtime so the web build has no font
  # flash and the mobile builds work with no network.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800

# This MUST be at root level, NOT inside flutter:
# flutter_native_splash:
#   color: "#FFFFFF"
#   image: assets/logo.png
  # The web build has no splash - the browser's own loading state is enough,
  # and a generated one shows a second full-screen logo before the app paints.
  # web: false
  # android_12:
  #   color: "#FFFFFF"
  #   image: assets/logo.png